cues.sort((a,b)=>a[0]-b[0]);

/* ---------- CONTROLE ---------- */
let hideT=0;
function idle(now){idleRaf=requestAnimationFrame(idle);const t=now/1000;T=t;const p=P(48+16*Math.cos(t*.05),40+12*Math.sin(t*.06));cam.x=p[0];cam.y=p[1];cam.z=.78;cam.r=0;cam.sx=cam.sy=0;GK=null;c.globalAlpha=1;world(.42,false);c.setTransform(1,0,0,1,0,0);const gr=c.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.6)');c.fillStyle=gr;c.fillRect(0,0,W,H)}
function frame(now){raf=requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;if(paused)return;
 if(state=='intro'){I+=dt;while(ici<IC.length&&IC[ici][0]<=I)IC[ici++][1]();intro(I);if(I>=6.2)begin();return}
 if(state!='play')return;T=Math.min(END,T+dt);while(ci<cues.length&&cues[ci][0]<=T){if(A.ctx)cues[ci][1]();ci++}

 subs();render();$('pg').style.width=(T/END*100)+'%';if(hideT&&performance.now()>hideT)$('hud').classList.add('hide');if(T>=END)finish()}

function startT(skip){cancelAnimationFrame(idleRaf);cancelAnimationFrame(raf);if(A.ctx)A.ctx.close();A.init();A.m.gain.value=A.mute?0:A.vol;paused=false;$('pa').textContent='Pausar';$('start').classList.add('off');$('pg').style.width='0';I=0;ici=0;if(skip)begin();else{state='intro';T=0}last=performance.now();raf=requestAnimationFrame(frame);poke()}
function finish(){state='end';cancelAnimationFrame(raf);$('sub').classList.remove('on');$('hud').classList.remove('hide');hideT=0;if(A.ctx)A.ctx.suspend()}

$('vol').oninput=e=>{A.vol=+e.target.value;if(A.m&&!A.mute)A.m.gain.value=A.vol};

addEventListener('mousemove',poke);addEventListener('keydown',e=>{if(e.code=='Space'){e.preventDefault();if(state=='idle')startT(false);else pause()}if(e.key=='f'||e.key=='F')$('fs').onclick();if(e.key=='m'||e.key=='M')$('mt').onclick()});

initWorld();idleRaf=requestAnimationFrame(idle);
